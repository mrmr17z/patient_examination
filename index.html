<!DOCTYPE html><html><head><meta charset="utf-8"><title>Abdominal Physical Examination VR</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0;height:100%;background:#0a1015;overflow:hidden}#b{position:fixed;right:12px;top:12px;z-index:5;display:flex;gap:8px}button{background:#0e8a8a;color:#fff;border:1px solid #6fe;padding:8px 14px;font:600 15px 'Arial Narrow',sans-serif;cursor:pointer}#h{position:fixed;left:12px;bottom:10px;color:#7cd;font:13px sans-serif;z-index:5}</style></head><body>
<div id="b"><button id="lg">EN / ع</button></div><div id="h">Desktop: drag = look · click floor = teleport · click buttons · drag chair handle (last step)</div>
<div id="ld" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#7cd;font:20px sans-serif;z-index:9;background:#0a1015">Loading… / جارٍ التحميل…</div>
<script>function fail(e){var d=document.getElementById('ld')||document.body.appendChild(document.createElement('div'));d.id='ld';d.style.cssText='position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#fff;font:18px sans-serif;z-index:9;background:#400';d.textContent='Error: '+(e&&e.message||e)}
addEventListener('error',function(e){fail(e.message)});addEventListener('unhandledrejection',function(e){fail(e.reason)})</script>

<script src="app.js"></script>
</body></html>
